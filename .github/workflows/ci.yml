name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code (pinned version; no login, no API key)
        run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: Run the plugin tests
        run: claude plugin test plugins/model-router
